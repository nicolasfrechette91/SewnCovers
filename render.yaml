services:
  - type: web
    name: sewncovers-api
    runtime: python
    plan: free
    region: ohio
    branch: main
    rootDir: backend
    buildCommand: python -m pip install .
    startCommand: python -m app.production
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        value: https://nicolasfrechette91.github.io
      # The connecting client is the third X-Forwarded-For entry from the
      # right behind Render's proxies (docs/deployment.md, "Client address").
      - key: CLIENT_IP_INDEX
        value: "-3"
      - key: DATABASE_URL
        sync: false
