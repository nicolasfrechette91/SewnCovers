[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sewncovers-api"
version = "0.1.0"
description = "FastAPI backend for the SewnCovers MVP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "boto3==1.40.11",
    "fastapi==0.139.2",
    "Pillow==12.3.0",
    "pydantic-settings==2.13.1",
    "psycopg[binary]==3.3.4",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.7.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
include = ["app*"]
