[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sewncovers-api"
version = "0.1.0"
description = "FastAPI backend for the SewnCovers MVP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "fastapi==0.139.2",
    "pydantic-settings==2.14.2",
    "psycopg[binary]==3.3.4",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.51.0",
]

# Production installs only the dependencies above. The extras belong to the two
# features that are off in production (CUSTOM_UPLOADS_ENABLED, COMMERCE_ENABLED);
# the application imports them only when the feature is used, and the production
# entry point refuses to start if a flag is on without its extra.
[project.optional-dependencies]
uploads = [
    "boto3==1.40.11",
    "Pillow==12.3.0",
]
commerce = [
    "stripe==15.5.1",
]
# Everything the test suite and the checks need, including both extras.
dev = [
    "sewncovers-api[commerce,uploads]",
    "httpx2==2.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# Coverage is measured on request (`python -m pytest --cov`), not on every run,
# and CI reports it without a minimum yet.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
include = ["app*"]
