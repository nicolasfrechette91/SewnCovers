# Weekly version updates. Minor and patch releases arrive as one pull request
# per ecosystem; major releases arrive one per dependency, because they can
# break things. Security updates are separate and not delayed by the cooldown,
# which skips releases younger than five days.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 5
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci(deps)
