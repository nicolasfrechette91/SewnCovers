name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - lint, type-check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run strict type-check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build ordinary static export
        run: npm run build
        env:
          GITHUB_ACTIONS: "false"
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/frontend/e2e/font-responses.cjs

      - name: Build GitHub Pages static export
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/frontend/e2e/font-responses.cjs

  backend:
    name: Backend - Ruff, tests, and dependency check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: 3.13.2
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pinned backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run backend tests
        run: python -m pytest

      - name: Check installed dependency consistency
        run: python -m pip check
