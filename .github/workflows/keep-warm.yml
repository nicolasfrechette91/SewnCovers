name: Keep the API warm

# Render's free instance sleeps after about 15 minutes without traffic and
# takes up to a minute to wake. Pinging /health every 12 minutes from 07:00 to
# 23:00 Toronto time keeps it awake while people are likely to visit, at about
# 16 instance-hours a day of Render's 750 free hours a month. Each ping runs one
# database query, so the database stays awake too. GitHub may start scheduled
# runs late (the top of the hour is busiest, hence minute 3) and disables the
# schedule after 60 days without repository activity; see docs/deployment.md.

on:
  schedule:
    # 07:03, 07:15, ... 22:51 local time; the last ping keeps it warm past 23:00.
    - cron: "3-59/12 7-22 * * *"
      timezone: America/Toronto
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API_URL: https://sewncovers-api.onrender.com

    steps:
      - name: Request /health
        run: |
          # A cold start can take about a minute: allow three attempts of 60
          # seconds (about 3.5 minutes in all) before reporting the API as down.
          status="$(curl --silent --max-time 60 --retry 2 --retry-all-errors --retry-delay 10 \
            --output /dev/null --write-out '%{http_code}' "${API_URL}/health" || true)"
          if [ "${status}" != "200" ]; then
            echo "::error title=API not healthy::${API_URL}/health answered HTTP ${status:-none}."
            exit 1
          fi
          echo "${API_URL}/health answered 200."
